name: Role Mailbox Probe

# Proves `hello@` and `security@` still receive, and alerts when they stop (#637).
#
# **A mailbox that stops receiving looks exactly like a quiet week.** These two addresses are the
# only route for Art. 15–21 requests, Code of Conduct reports, security disclosure and Let's
# Encrypt's expiry notices, and the statutory clock on a data-subject request starts when it is
# sent rather than when it is read (docs/ops/EMAIL.md § Monitoring).
#
# **It runs on GitHub because the mail does not run on our node.** The mailboxes live on Hetzner
# Webhosting, independent of k3s, so a CronJob in the cluster would report cluster death as mail
# death — the argument HEALTHCHECKS.md opens with, applied to a service that is not even on the
# node.
#
# **A conditional ping, never a heartbeat** (#271). `scripts/mail-probe.py` sends, waits for that
# exact message to arrive over IMAP, deletes it, and only then pings. A bare login would pass while
# the MX pointed nowhere, which is half the failures this is for.
#
# **Two mailboxes and two checks, probed in one job.** An alias would not have this property. Both
# are probed even when the first fails, because the second is worth testing precisely then — the
# step collects the exit codes rather than returning the first.
#
# **Arming it is four repository secrets and no change to this file.** Without them the job says so
# in its summary rather than passing quietly — a silent skip is the failure mode this repository has
# been bitten by twice.

on:
  schedule:
    # **Daily, and derived from measurement rather than from wishful thinking.** GitHub honours the
    # daily schedules here (site-probe.yml records the numbers: a median gap near 24h, a worst near
    # 34h) and refuses fast ones. The checks that receive these pings therefore want a 24-hour
    # period and a 24-hour grace, which leaves headroom over that worst gap.
    #
    # 06:23 keeps it clear of the site probe at 05:37 and of the two nightly scans, and off the top
    # of the hour, where shared runners stampede.
    - cron: '23 6 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  # Not `cancel-in-progress`: a cancelled run is a probe that never asserted anything, and its
  # check would then go late for a reason that has nothing to do with the mailbox.
  group: mail-probe
  cancel-in-progress: false

jobs:
  probe:
    name: Probe the role mailboxes
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # `sparse-checkout` because one script is all this needs. Nothing else in the tree is read,
      # and a narrower checkout is a smaller blast radius for a workflow that holds a mail password.
      - name: Check out the probe
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: scripts/mail-probe.py
          sparse-checkout-cone-mode: false
          persist-credentials: false

      # **One job with both mailboxes named, rather than a matrix over secret names.**
      # `secrets[matrix.name]` reads the secrets context dynamically, and GitHub answers that by
      # injecting *every* organisation and repository secret into the runner — zizmor's
      # `overprovisioned-secrets` and CodeQL both refuse it. Naming the four here is the fix.
      #
      # The obvious alternative, `${{ cond && secrets.A || secrets.B }}`, is a trap: the `||` arm
      # also wins when `secrets.A` is merely empty, so an unset password would send the other
      # mailbox's credential. A wrong password costs about 25 minutes of Hetzner blocking the port
      # for this address (docs/ops/EMAIL.md § Monitoring, step 2a).
      - name: Send, wait for delivery, then ping
        env:
          HELLO_PASSWORD: ${{ secrets.MAIL_PROBE_HELLO_PASSWORD }}
          HELLO_PING_URL: ${{ secrets.HEALTHCHECKS_MAIL_HELLO_PING_URL }}
          SECURITY_PASSWORD: ${{ secrets.MAIL_PROBE_SECURITY_PASSWORD }}
          SECURITY_PING_URL: ${{ secrets.HEALTHCHECKS_MAIL_SECURITY_PING_URL }}
        run: |
          set -uo pipefail

          # Both mailboxes are probed in one job, and one failing must not skip the other: they have
          # different audiences and different failure modes, and the second is worth testing
          # precisely on the day the first is broken. So the exit code is collected, not returned.
          overall=0

          probe() {
            mailbox="$1"
            password="$2"
            ping_url="$3"

            if [ -z "${password}" ] || [ -z "${ping_url}" ]; then
              {
                echo "## ⏸️ Not probing \`${mailbox}\` — its secrets are not set"
                echo
                echo "**To activate:** create a check on healthchecks.io with a 24-hour period and a"
                echo "24-hour grace, then add its ping URL and the mailbox password as repository"
                echo "secrets. docs/ops/EMAIL.md § Monitoring names all four."
              } >> "$GITHUB_STEP_SUMMARY"
              echo "Secrets for ${mailbox} unset — skipping."
              return 0
            fi

            if MAIL_PROBE_PASSWORD="${password}" \
                 python3 scripts/mail-probe.py --mailbox "${mailbox}" --ping-url "${ping_url}"; then
              echo "## ✅ \`${mailbox}\` receives" >> "$GITHUB_STEP_SUMMARY"
              return 0
            fi

            {
              echo "## 🔴 \`${mailbox}\` did not receive"
              echo
              echo "The step log names which hop failed. The check has been pinged \`/fail\`, so the"
              echo "alert is already out rather than waiting on the grace period."
              echo
              echo "**What to do:** docs/ops/EMAIL.md § Monitoring."
            } >> "$GITHUB_STEP_SUMMARY"
            overall=1
            return 0
          }

          probe hello@event-junkie.de "${HELLO_PASSWORD}" "${HELLO_PING_URL}"
          probe security@event-junkie.de "${SECURITY_PASSWORD}" "${SECURITY_PING_URL}"

          exit "${overall}"
