<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>OHM</title>
    <!--
        Hand-crafted variant of ohm-overview.html, kept to the same markup but carrying the cases
        the two-night live listing could not show: a January date seen from late December (the
        year-rollover the nearest-occurrence rule has to get right), a night with no time, a
        lineup containing a placeholder slot, and an item with no title at all.
    -->
</head>
<body>
<section class="page-content">
    <section class="events padding-lr">
        <ul class="event-list">
            <li class="event-item">
                <div class="checkbox"></div>
                <div class="event-item-details">
                    <div class="event-item-details-more">
                        <div class="event-date">
                            <h2>02/01</h2>
                        </div>
                        <div class="event-time">
                            23:59				</div>

                        <h2 class="event-title">New Year Reset</h2>
                        <div class="event-lineup medium-type">Aroh<br />
                            Sepehr<br />
                        </div>
                    </div>
                </div>
                <div class="event-item-hidden">
                </div>

            <li class="event-item">
                <div class="checkbox"></div>
                <div class="event-item-details">
                    <div class="event-item-details-more">
                        <div class="event-date">
                            <h2>30/12</h2>
                        </div>
                        <div class="event-time">
                        </div>

                        <h2 class="event-title">Tonight, Time TBC</h2>
                        <div class="event-lineup medium-type">Rroxymore<br />
                            TBA<br />
                            Support<br />
                        </div>
                    </div>
                </div>
                <div class="event-item-hidden">
                </div>

            <li class="event-item">
                <div class="checkbox"></div>
                <div class="event-item-details">
                    <div class="event-item-details-more">
                        <div class="event-date">
                            <h2>05/01</h2>
                        </div>
                        <div class="event-time">
                            22:00				</div>

                        <div class="event-lineup medium-type">Nobody<br />
                        </div>
                    </div>
                </div>
                <div class="event-item-hidden">
                </div>

            <li class="event-item">
                <div class="checkbox"></div>
                <div class="event-item-details">
                    <div class="event-item-details-more">
                        <div class="event-date">
                            <h2>coming soon</h2>
                        </div>
                        <div class="event-time">
                            23:00				</div>

                        <h2 class="event-title">Date To Be Announced</h2>
                        <div class="event-lineup medium-type">Ectomorph<br />
                        </div>
                    </div>
                </div>
                <div class="event-item-hidden">
                </div>

        </ul>
    </section>
</section>
</body>
</html>
